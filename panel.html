
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Atendimento</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f6fa;color:#172033}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{height:100dvh;display:grid;grid-template-columns:340px 1fr;overflow:hidden}
    .sidebar{background:#fff;border-right:1px solid #e8eaf0;display:flex;flex-direction:column;min-width:0}
    .brand{height:72px;padding:0 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee}
    .brand-icon{width:38px;height:38px;border-radius:12px;background:#16a34a;color:#fff;display:grid;place-items:center}
    .brand h1{font-size:16px;margin:0}
    .brand small{color:#8992a3;font-size:11px}
    .side-top{padding:18px 16px 12px}
    .side-top h2{font-size:13px;margin:0 0 12px;color:#667085}
    .search{width:100%;padding:11px 13px;border:1px solid #e5e7eb;border-radius:10px;outline:none;background:#fafafa}
    .search:focus{border-color:#16a34a}
    .filters{display:flex;gap:6px;margin-top:12px}
    .filter{border:0;background:#f1f3f6;color:#667085;padding:7px 10px;border-radius:20px;font-size:11px}
    .filter.active{background:#dcfce7;color:#15803d;font-weight:700}
    .channel-list{overflow:auto;flex:1}
    .channel{width:100%;border:0;background:#fff;text-align:left;padding:15px 16px;display:flex;gap:12px;border-bottom:1px solid #f0f1f4;transition:.15s}
    .channel:hover{background:#fafafa}
    .channel.active{background:#f0fdf4;border-left:3px solid #16a34a;padding-left:13px}
    .channel-avatar{width:42px;height:42px;flex:none;border-radius:50%;background:#e8f5ed;color:#15803d;display:grid;place-items:center;font-weight:700}
    .channel-main{min-width:0;flex:1}
    .channel-line{display:flex;justify-content:space-between;gap:8px}
    .channel-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .channel-time{font-size:10px;color:#98a2b3;white-space:nowrap}
    .channel-domain{font-size:10px;color:#16a34a;margin-top:3px}
    .channel-message{font-size:11px;color:#8a93a3;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .channel-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
    .status{font-size:10px;color:#16a34a}
    .unread{background:#16a34a;color:#fff;min-width:19px;height:19px;border-radius:20px;display:grid;place-items:center;padding:0 5px;font-size:10px;font-weight:700}
    .empty-list{padding:40px 20px;text-align:center;color:#98a2b3;font-size:12px}
    .sidebar-footer{padding:14px 18px;border-top:1px solid #eee;color:#98a2b3;font-size:10px}
    .main{display:flex;flex-direction:column;min-width:0;background:#f7f8fa}
    .topbar{height:72px;background:#fff;border-bottom:1px solid #e8eaf0;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .topbar h2{font-size:15px;margin:0}
    .topbar p{font-size:11px;color:#98a2b3;margin:4px 0 0}
    .top-actions{display:flex;gap:8px}
    .btn{border:1px solid #e5e7eb;background:#fff;padding:9px 13px;border-radius:9px;font-size:11px;color:#475467}
    .btn:hover{background:#f8fafc}
    .btn.danger{color:#dc2626;border-color:#fecaca}
    .btn.green{background:#16a34a;border-color:#16a34a;color:white}
    .chat-area{flex:1;display:flex;flex-direction:column;min-height:0}
    .welcome{margin:auto;text-align:center;padding:30px;color:#98a2b3}
    .welcome-icon{width:70px;height:70px;border-radius:22px;background:#e9f8ee;color:#16a34a;display:grid;place-items:center;margin:0 auto 18px}
    .welcome h3{font-size:17px;color:#344054;margin:0 0 8px}
    .welcome p{font-size:12px;line-height:1.6;max-width:280px}
    .chat-header{background:#fff;padding:14px 24px;border-bottom:1px solid #e8eaf0;display:flex;align-items:center;justify-content:space-between;gap:15px}
    .visitor{display:flex;align-items:center;gap:12px;min-width:0}
    .visitor-avatar{width:40px;height:40px;border-radius:50%;background:#e8f5ed;color:#15803d;display:grid;place-items:center;font-weight:700}
    .visitor h3{font-size:13px;margin:0}
    .visitor p{font-size:10px;color:#98a2b3;margin:4px 0 0;overflow-wrap:anywhere}
    .chat-meta{font-size:10px;color:#667085;text-align:right}
    .messages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:13px}
    .date-separator{text-align:center;font-size:10px;color:#98a2b3;margin:5px 0 10px}
    .message-row{display:flex;flex-direction:column;max-width:min(72%,560px);align-self:flex-start}
    .message-row.agent{align-self:flex-end}
    .bubble{padding:11px 14px;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid #edf0f2;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 2px #00000008}
    .agent .bubble{background:#dcfce7;border-color:#c8f1d5;border-radius:14px 14px 4px 14px}
    .message-info{font-size:9px;color:#98a2b3;margin-top:5px;padding:0 3px}
    .agent .message-info{text-align:right}
    .composer{padding:15px 24px;background:#fff;border-top:1px solid #e8eaf0}
    .composer-inner{display:flex;gap:10px;align-items:flex-end}
    .composer textarea{flex:1;resize:none;min-height:44px;max-height:120px;border:1px solid #e5e7eb;border-radius:11px;padding:12px;outline:none;font:13px Arial}
    .composer textarea:focus{border-color:#16a34a}
    .send{width:44px;height:44px;border:0;border-radius:11px;background:#16a34a;color:#fff;display:grid;place-items:center}
    .send:disabled{opacity:.4;cursor:not-allowed}
    .closed-note{text-align:center;color:#dc2626;font-size:11px;padding:12px}
    .mobile-back{display:none}
    @media(max-width:760px){
      .app{grid-template-columns:1fr}
      .sidebar{grid-column:1;grid-row:1}
      .main{display:none}
      .app.chat-open .sidebar{display:none}
      .app.chat-open .main{display:flex}
      .brand{height:62px}
      .topbar{height:62px;padding:0 14px}
      .topbar p{display:none}
      .chat-header{padding:12px 14px}
      .messages{padding:16px 12px}
      .composer{padding:12px}
      .message-row{max-width:88%}
      .mobile-back{display:inline-grid;place-items:center;width:34px;height:34px;border:0;background:#f1f3f6;border-radius:9px;margin-right:8px}
      .topbar-left{display:flex;align-items:center}
      .top-actions .btn{padding:8px}
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><i data-lucide="messages-square"></i></div>
      <div>
        <h1>Central de Atendimento</h1>
        <small>Chat Global · Firebase</small>
      </div>
    </div>

    <div class="side-top">
      <h2>CONVERSAS</h2>
      <input class="search" id="search" placeholder="Buscar conversa ou site...">
      <div class="filters">
        <button class="filter active" data-filter="all">Todas</button>
        <button class="filter" data-filter="unread">Não lidas</button>
        <button class="filter" data-filter="open">Abertas</button>
      </div>
    </div>

    <div class="channel-list" id="channelList">
      <div class="empty-list">Conectando ao Firestore...</div>
    </div>

    <div class="sidebar-footer">
      <span id="connection">Conectando...</span>
      <span style="float:right">CHAT GLOBAL</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-back" id="backBtn"><i data-lucide="arrow-left"></i></button>
        <div>
          <h2 id="pageTitle">Atendimento</h2>
          <p id="pageSubtitle">Selecione uma conversa para começar</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn" id="refreshBtn">Atualizar</button>
        <button class="btn danger" id="closeBtn" style="display:none">Encerrar</button>
      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="welcome">
        <div class="welcome-icon"><i data-lucide="messages-square" style="width:30px;height:30px"></i></div>
        <h3>Nenhuma conversa selecionada</h3>
        <p>Quando um visitante acessar uma página com o widget instalado, o canal aparecerá automaticamente aqui.</p>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyB0JYggDaO-7klT2f15N1rcF2C27uhA5ek",
    authDomain: "opsmac-e6d45.firebaseapp.com",
    projectId: "opsmac-e6d45",
    storageBucket: "opsmac-e6d45.firebasestorage.app",
    messagingSenderId: "913611355587",
    appId: "1:913611355587:web:3c383491b41346e3017976"
  };

  const $ = id => document.getElementById(id);
  const appEl = $("app");
  let db, channels = [], selectedId = null;
  let channelUnsubscribe = null, messageUnsubscribe = null;
  let activeFilter = "all";
  let busy = false;

  const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[char]));

  function timestampMillis(value) {
    if (!value) return 0;
    if (typeof value.toMillis === "function") return value.toMillis();
    if (value.seconds) return value.seconds * 1000;
    if (value instanceof Date) return value.getTime();
    return 0;
  }

  function formatTime(value) {
    const ms = timestampMillis(value);
    if (!ms) return "";
    return new Date(ms).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }

  function formatDate(value) {
    const ms = timestampMillis(value);
    if (!ms) return "";
    return new Date(ms).toLocaleDateString("pt-BR");
  }

  function initials(name) {
    return String(name || "V").trim().split(/\s+/).slice(0,2).map(x=>x[0] || "").join("").toUpperCase();
  }

  function renderChannels() {
    const term = $("search").value.toLowerCase().trim();

    const filtered = channels.filter(channel => {
      const data = channel.data;
      if (data.status === "closed") return false;

      const matchesText = [
        data.title, data.domain, data.url, data.client?.name, data.lastMessage
      ].join(" ").toLowerCase().includes(term);

      const matchesFilter =
        activeFilter === "all" ||
        (activeFilter === "unread" && Number(data.unread || 0) > 0) ||
        (activeFilter === "open" && data.status !== "closed");

      return matchesText && matchesFilter;
    });

    if (!filtered.length) {
      $("channelList").innerHTML = `
        <div class="empty-list">
          ${channels.length ? "Nenhuma conversa encontrada." : "Nenhum visitante por enquanto."}
        </div>`;
      return;
    }

    $("channelList").innerHTML = filtered.map(channel => {
      const d = channel.data;
      const name = d.client?.name || "Visitante";
      const unread = Number(d.unread || 0);

      return `
        <button class="channel ${selectedId === channel.id ? "active" : ""}" data-id="${escapeHTML(channel.id)}">
          <div class="channel-avatar">${escapeHTML(initials(name))}</div>
          <div class="channel-main">
            <div class="channel-line">
              <div class="channel-title">${escapeHTML(d.title || "Página sem título")}</div>
              <span class="channel-time">${formatTime(d.updatedAt || d.createdAt)}</span>
            </div>
            <div class="channel-domain">${escapeHTML(d.domain || d.url || "Site")}</div>
            <div class="channel-message">${escapeHTML(d.lastMessage || "Nova conversa")}</div>
            <div class="channel-bottom">
              <span class="status">● ${escapeHTML(d.status || "open")}</span>
              ${unread ? `<span class="unread">${unread > 99 ? "99+" : unread}</span>` : ""}
            </div>
          </div>
        </button>`;
    }).join("");

    $("channelList").querySelectorAll(".channel").forEach(button => {
      button.addEventListener("click", () => openChat(button.dataset.id));
    });
  }

  function renderChatShell(channel) {
    const d = channel.data;
    const visitorName = d.client?.name || "Visitante";
    $("pageTitle").textContent = visitorName;
    $("pageSubtitle").textContent = d.domain || d.url || "Canal de atendimento";
    $("closeBtn").style.display = d.status === "closed" ? "none" : "inline-block";

    $("chatArea").innerHTML = `
      <div class="chat-header">
        <div class="visitor">
          <div class="visitor-avatar">${escapeHTML(initials(visitorName))}</div>
          <div>
            <h3>${escapeHTML(visitorName)}</h3>
            <p>${escapeHTML(d.title || "Página sem título")} · ${escapeHTML(d.domain || "")}</p>
          </div>
        </div>
        <div class="chat-meta">
          <div>CANAL ${escapeHTML(channel.id.slice(0,8))}</div>
          <div style="margin-top:5px">${escapeHTML(formatDate(d.createdAt))}</div>
        </div>
      </div>
      <div class="messages" id="messages">
        <div class="date-separator">Carregando mensagens...</div>
      </div>
      ${d.status === "closed" ? `
        <div class="closed-note">Este atendimento foi encerrado.</div>
      ` : `
        <div class="composer">
          <div class="composer-inner">
            <textarea id="messageInput" rows="1" placeholder="Digite sua resposta..."></textarea>
            <button class="send" id="sendBtn" title="Enviar"><i data-lucide="send"></i></button>
          </div>
        </div>
      `}
    `;

    if (d.status !== "closed") {
      $("sendBtn").addEventListener("click", sendMessage);
      $("messageInput").addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });
      $("messageInput").addEventListener("input", event => {
        event.target.style.height = "auto";
        event.target.style.height = Math.min(event.target.scrollHeight,120) + "px";
      });
    }

    if (window.lucide) lucide.createIcons();
  }

  function renderMessages(snapshot) {
    const box = $("messages");
    if (!box) return;

    if (snapshot.empty) {
      box.innerHTML = `<div class="date-separator">Início da conversa</div>`;
      return;
    }

    box.innerHTML = snapshot.docs.map(doc => {
      const msg = doc.data();
      const isAgent = msg.sender === "agent";
      const time = formatTime(msg.timestamp);

      return `
        <div class="message-row ${isAgent ? "agent" : ""}">
          <div class="bubble">${escapeHTML(msg.text || "")}</div>
          <div class="message-info">${isAgent ? "Você" : "Visitante"} · ${time}</div>
        </div>`;
    }).join("");

    box.scrollTop = box.scrollHeight;
  }

  async function openChat(id) {
    const channel = channels.find(item => item.id === id);
    if (!channel) return;

    selectedId = id;
    renderChannels();
    renderChatShell(channel);
    appEl.classList.add("chat-open");

    if (messageUnsubscribe) messageUnsubscribe();

    const channelRef = db.collection("channels").doc(id);

    try {
      await channelRef.update({ unread: 0 });
    } catch (error) {
      console.warn("Não foi possível zerar notificações:", error);
    }

    messageUnsubscribe = channelRef.collection("messages")
      .orderBy("timestamp","asc")
      .onSnapshot(renderMessages, error => {
        console.error(error);
        const box = $("messages");
        if (box) box.innerHTML = `<div class="date-separator">Erro ao carregar mensagens.</div>`;
      });
  }

  async function sendMessage() {
    if (busy || !selectedId) return;

    const input = $("messageInput");
    const text = input?.value.trim();
    if (!text) return;

    busy = true;
    $("sendBtn").disabled = true;

    try {
      const channelRef = db.collection("channels").doc(selectedId);
      const messageRef = channelRef.collection("messages").doc();
      const batch = db.batch();
      const serverTimestamp = firebase.firestore.FieldValue.serverTimestamp();

      batch.set(messageRef, {
        text,
        sender: "agent",
        timestamp: serverTimestamp
      });

      batch.update(channelRef, {
        lastMessage: text,
        updatedAt: serverTimestamp,
        unread: 0
      });

      await batch.commit();
      input.value = "";
      input.style.height = "auto";
      input.focus();
    } catch (error) {
      console.error(error);
      alert("Não foi possível enviar a mensagem. Verifique a conexão e as regras do Firestore.");
    } finally {
      busy = false;
      const sendBtn = $("sendBtn");
      if (sendBtn) sendBtn.disabled = false;
    }
  }

  async function closeChat() {
    if (!selectedId) return;
    if (!confirm("Deseja encerrar este atendimento?")) return;

    try {
      await db.collection("channels").doc(selectedId).update({
        status: "closed",
        closedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      selectedId = null;
      if (messageUnsubscribe) messageUnsubscribe();
      messageUnsubscribe = null;
      appEl.classList.remove("chat-open");
      showWelcome();
    } catch (error) {
      console.error(error);
      alert("Não foi possível encerrar o atendimento.");
    }
  }

  function showWelcome() {
    $("pageTitle").textContent = "Atendimento";
    $("pageSubtitle").textContent = "Selecione uma conversa para começar";
    $("closeBtn").style.display = "none";
    $("chatArea").innerHTML = `
      <div class="welcome">
        <div class="welcome-icon"><i data-lucide="messages-square" style="width:30px;height:30px"></i></div>
        <h3>Nenhuma conversa selecionada</h3>
        <p>Os novos visitantes aparecerão automaticamente nesta lista.</p>
      </div>`;
    if (window.lucide) lucide.createIcons();
  }

  function subscribeChannels() {
    if (channelUnsubscribe) channelUnsubscribe();

    channelUnsubscribe = db.collection("channels")
      .orderBy("updatedAt","desc")
      .onSnapshot(snapshot => {
        channels = snapshot.docs.map(doc => ({
          id: doc.id,
          data: doc.data()
        }));

        $("connection").textContent = "● Conectado ao Firestore";
        $("connection").style.color = "#16a34a";

        renderChannels();

        if (selectedId) {
          const selected = channels.find(item => item.id === selectedId);
          if (selected) {
            renderChatShell(selected);
            // O listener de mensagens continua ativo após atualizações do canal.
          } else {
            selectedId = null;
            if (messageUnsubscribe) messageUnsubscribe();
            showWelcome();
          }
        }
      }, error => {
        console.error("Erro Firestore:", error);
        $("connection").textContent = "Erro de conexão";
        $("connection").style.color = "#dc2626";
        $("channelList").innerHTML = `<div class="empty-list">Não foi possível acessar os canais. Verifique as regras do Firestore.</div>`;
      });
  }

  $("search").addEventListener("input", renderChannels);

  document.querySelectorAll(".filter").forEach(button => {
    button.addEventListener("click", () => {
      activeFilter = button.dataset.filter;
      document.querySelectorAll(".filter").forEach(item => item.classList.remove("active"));
      button.classList.add("active");
      renderChannels();
    });
  });

  $("closeBtn").addEventListener("click", closeChat);

  $("backBtn").addEventListener("click", () => {
    appEl.classList.remove("chat-open");
  });

  $("refreshBtn").addEventListener("click", () => {
    renderChannels();
    if (selectedId) {
      const channel = channels.find(item => item.id === selectedId);
      if (channel) renderChatShell(channel);
    }
  });

  try {
    const firebaseApp = firebase.apps.length
      ? firebase.app()
      : firebase.initializeApp(FIREBASE_CONFIG);

    db = firebaseApp.firestore();
    subscribeChannels();
  } catch (error) {
    console.error(error);
    $("connection").textContent = "Falha ao iniciar Firebase";
    $("channelList").innerHTML = `<div class="empty-list">Erro ao iniciar o Firebase. Confira a configuração.</div>`;
  }

  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
