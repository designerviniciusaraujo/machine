

<!DOCTYPE html>
<html lang="pt-BR" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theme System | Light & Dark</title>

    <link rel="stylesheet" href="assets/css/theme.css">

    <script src="assets/js/theme.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        .theme-panel {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .theme-button {
            background: var(--primary);
            color: white;
            padding: 10px 16px;
            border-radius: 9px;
            font-weight: 600;
        }

        .theme-button-secondary {
            background: var(--bg-theme);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 9px;
        }

        .theme-input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
        }

        .theme-input:focus {
            border-color: var(--primary);
        }

        .theme-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 9px;
            color: var(--text-muted);
        }

        .theme-nav-item.active {
            background: var(--bg-theme);
            color: var(--text);
        }

        .theme-divider {
            border-color: var(--border);
        }
    </style>
</head>

<body>



    <!-- LAYOUT -->
    <div class="max-w-7xl mx-auto p-5 lg:p-8 grid grid-cols-1 lg:grid-cols-[230px_1fr] gap-6">

       

        <!-- MAIN -->
        <main class="space-y-6">

            <!-- TITLE -->
            <section class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                <div>
                    <p class="text-sm text-muted mb-1">
                        Bem-vindo de volta
                    </p>

                    <h1 class="text-2xl sm:text-3xl font-bold">
                       Lojas Online agora
                    </h1>

                    <p class="text-sm text-muted mt-2">
                        Teste completo do sistema de temas.
                    </p>
                </div>

                

            </section>

            <!-- TABLE -->
            <section class="theme-panel p-5">

                <h2 class="font-bold text-lg mb-4">
                    Lojas
                </h2>

                <div class="overflow-x-auto">

                 <section class="theme-panel p-5">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
        <h2 class="font-bold text-lg">Lojas Online</h2>

        <input
            type="search"
            id="searchStore"
            placeholder="Buscar loja..."
            class="theme-input sm:max-w-xs"
        >
    </div>

    <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">

            <thead>
                <tr class="text-muted border-b theme-divider">
                    <th class="py-3 pr-4">Nome</th>
                    <th class="py-3 pr-4">Categoria</th>
                    <th class="py-3 pr-4">Status</th>
                    <th class="py-3 pr-4">Data</th>
                    <th class="py-3 text-right">Acesso</th>
                </tr>
            </thead>

            <tbody id="storeList">

                <tr class="border-b theme-divider">
                    <td class="py-4 pr-4 font-medium">Shopify Beauty</td>
                    <td class="py-4 pr-4">E-commerce</td>
                    <td class="py-4 pr-4 text-green-500">● Online</td>
                    <td class="py-4 pr-4">14/11/2026</td>
                    <td class="py-4 text-right">
                        <a href="https://designerviniciusaraujo.github.io/web/e-machine/e-beauty/index.html"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="text-blue-500 font-semibold hover:underline">
                            Acessar ↗
                        </a>
                    </td>
                </tr>

                <tr class="border-b theme-divider">
                    <td class="py-4 pr-4 font-medium">MotoBox</td>
                    <td class="py-4 pr-4">DropGhost</td>
                    <td class="py-4 pr-4 text-yellow-500">● Online</td>
                    <td class="py-4 pr-4">14/11/2026</td>
                    <td class="py-4 text-right text-muted">Em breve

                        <a href="https://designerviniciusaraujo.github.io/motobox/"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="text-blue-500 font-semibold hover:underline">
                            Acessar ↗
                        </a>
                    </td>
                </tr>

                <tr>
                    <td class="py-4 pr-4 font-medium">Portfolio</td>
                    <td class="py-4 pr-4">Marketing</td>
                    <td class="py-4 pr-4 text-green-500">● Online</td>
                    <td class="py-4 pr-4">14/11/2026</td>
                    <td class="py-4 text-right">
                        <a href="https://designerviniciusaraujo.github.io/motobox/"

                            Acessar ↗

                    </td>
                </tr>

            </tbody>
        </table>
    </div>

    <script>
        document.getElementById('searchStore').addEventListener('input', function () {
            const search = this.value.toLowerCase();

            document.querySelectorAll('#storeList tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(search)
                    ? ''
                    : 'none';
            });
        });
    </script>

</section>

                </div>

            </section>

       

       





        </main>

    </div>

</body>
</html>
