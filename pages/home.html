

<!DOCTYPE html>
<html lang="pt-BR" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theme System | Light & Dark</title>

    <link rel="stylesheet" href="assets/css/theme.css">

    <script src="assets/js/theme.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        .theme-panel {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .theme-button {
            background: var(--primary);
            color: white;
            padding: 10px 16px;
            border-radius: 9px;
            font-weight: 600;
        }

        .theme-button-secondary {
            background: var(--bg-theme);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 9px;
        }

        .theme-input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
        }

        .theme-input:focus {
            border-color: var(--primary);
        }

        .theme-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 9px;
            color: var(--text-muted);
        }

        .theme-nav-item.active {
            background: var(--bg-theme);
            color: var(--text);
        }

        .theme-divider {
            border-color: var(--border);
        }
    </style>
</head>

<body>



    <!-- LAYOUT -->
    <div class="max-w-7xl mx-auto p-5 lg:p-8 grid grid-cols-1 lg:grid-cols-[230px_1fr] gap-6">

       

        <!-- MAIN -->
        <main class="space-y-6">

            <!-- TITLE -->
            <section class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                <div>
                    <p class="text-sm text-muted mb-1">
                        Bem-vindo de volta
                    </p>

                    <h1 class="text-2xl sm:text-3xl font-bold">
                        Onde vamos hoje?
                    </h1>

                    <p class="text-sm text-muted mt-2">
                        Teste completo do sistema de temas.
                    </p>
                </div>

                <button class="theme-button">
                    + Nova atividade
                </button>

            </section>

       

       





        </main>

    </div>

</body>
</html>
