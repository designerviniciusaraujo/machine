
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha Loja Online</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
    }
    header {
      background: white;
      padding: 25px;
      border-bottom: 1px solid #ddd;
    }
    main {
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
    }
    .produto {
      background: white;
      padding: 30px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h2>Minha Loja Online</h2>
  </header>

  <main>
    <div class="produto">
      <h1>Bem-vindo à nossa loja!</h1>
      <p>Conheça nossos produtos e ofertas especiais.</p>
      <button>Ver produtos</button>
    </div>
  </main>

  <!-- NOSSO ÚNICO SCRIPT -->
  <script src="https://designerviniciusaraujo.github.io/machine/xat.js"></script>
<script>
  
// chat-global.js
// Script universal para instalar chat em qualquer site.
// Firebase compat SDK carregado pelo próprio script.

(function () {
  if (window.__globalChatLoaded) return;
  window.__globalChatLoaded = true;

  const FIREBASE_CONFIG = {
    
apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
  authDomain: "myops-d7525.firebaseapp.com",
  projectId: "myops-d7525",
  storageBucket: "myops-d7525.firebasestorage.app",
  messagingSenderId: "247824192162",
  appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"
  };

  const FIREBASE_VERSION = "10.14.1";
  const SDK = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = src;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  async function init() {
    await loadScript(`${SDK}/firebase-app-compat.js`);
    await loadScript(`${SDK}/firebase-firestore-compat.js`);

    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }

    const db = firebase.firestore();

    // Cria canal
    const channel = await db.collection("chats").add({
      title: document.title,
      url: location.href,
      domain: location.hostname,
      status: "open",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Botão flutuante
    const button = document.createElement("button");
    button.innerHTML = "💬 Fale conosco";

    Object.assign(button.style, {
      position: "fixed",
      bottom: "24px",
      right: "24px",
      zIndex: "999999",
      background: "#16a34a",
      color: "#fff",
      border: "none",
      borderRadius: "50px",
      padding: "16px 23px",
      fontSize: "15px",
      fontWeight: "bold",
      cursor: "pointer",
      boxShadow: "0 4px 20px #0003"
    });

    button.onclick = () => {
      window.dispatchEvent(new CustomEvent("global-chat-open", {
        detail: {
          channelId: channel.id,
          db
        }
      }));

      console.log("Chat aberto:", channel.id);
    };

    document.body.appendChild(button);

    window.GlobalChat = {
      channelId: channel.id,
      db
    };

    console.log("Global Chat conectado:", channel.id);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

  </script>
</body>
</html>
